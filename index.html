<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการติดตามผู้ป่วยจิตเวชหลังจำหน่าย โรงพยาบาลยโสธร</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (XLSX Export) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            50: '#f9f5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f7f2fb; }

        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #c084fc; }

</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- Custom Modal Container -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full mx-4 shadow-2xl border-4 border-pastel-200 transform transition-all">
            <div id="modalContent" class="text-center"></div>
        </div>
    </div>

    <script>
        // --- State Management & Real-time Sync (Supabase Integration Ready / BroadcastChannel) ---
        const USERS = {
            'Ployrung': { pass: '1106', ward: 'หอผู้ป่วยสุขใจ โรงพยาบาลยโสธร', code: 'sukjai' },
            'ning': { pass: '1212', ward: 'หอผู้ป่วยสุขใจ IMC โรงพยาบาลยโสธร', code: 'sukjai_imc' }
        };

        let currentUser = JSON.parse(localStorage.getItem('yasothon_user')) || null;
        let currentTab = localStorage.getItem('yasothon_tab') || 'dashboard';
        let currentSubTab = localStorage.getItem('yasothon_subtab') || 'daily';

        // BroadcastChannel for instant cross-tab & multi-device sync simulation
        const syncChannel = new BroadcastChannel('yasothon_hospital_sync_v1');

        function getStorageData(key, defaultVal) {
            const val = localStorage.getItem('yasothon_' + key);
            return val ? JSON.parse(val) : defaultVal;
        }

        function setStorageData(key, val) {
            localStorage.setItem('yasothon_' + key, JSON.stringify(val));
            syncChannel.postMessage({ key: 'yasothon_' + key, data: val });
            window.dispatchEvent(new Event('storage-sync'));
        }

        syncChannel.onmessage = (event) => {
            if (event.data && event.data.key) {
                localStorage.setItem(event.data.key, JSON.stringify(event.data.data));
                patients = getStorageData('patients', patients);
                trackings = getStorageData('trackings', trackings);
                render();
            }
        };

        let patients = getStorageData('patients', [
            {
                id: 'P-001',
                ward: 'sukjai',
                name: 'นายสมชาย ใจดี',
                address: '123 หมู่ 1 ถ.สุนทรราช ต.ในเมือง อ.เมือง จ.ยโสธร 35000',
                phone: '0812345678',
                healthCenter: 'รพ.สต.บ้านตาดทอง',
                dischargeDate: '2026-05-01',
                appointmentDate: '2026-05-15',
                fu1Date: '2026-05-03',
                fu2Date: '2026-05-10',
                fu3Date: '2026-05-24',
                fu4Date: '2026-06-07',
                sequence: '01',
                createdAt: '2026-05-01'
            },
            {
                id: 'P-002',
                ward: 'sukjai_imc',
                name: 'นางสาวสมหญิง รักสงบ',
                address: '45 หมู่ 4 ต.เขื่องใน อ.เขื่องใน จ.ยโสธร 35150',
                phone: '0898765432',
                healthCenter: 'รพ.สต.เขื่องใน',
                dischargeDate: '2026-05-05',
                appointmentDate: '2026-05-20',
                fu1Date: '2026-05-07',
                fu2Date: '2026-05-14',
                fu3Date: '2026-05-28',
                fu4Date: '2026-06-11',
                sequence: '02',
                createdAt: '2026-05-05'
            }
        ]);

        let trackings = getStorageData('trackings', [
            {
                id: 'T-001',
                patientId: 'P-001',
                ward: 'sukjai',
                fuNumber: '1',
                trackingDate: '2026-05-03',
                time: '10:00',
                informant: 'ญาติ',
                channel: 'โทรศัพท์',
                medStatus: 'รับประทานครบ',
                medSideEffect: 'ไม่มี',
                sleepStatus: 'ปกติ',
                moodStatus: 'ปกติ',
                mentalStatus: 'ไม่มี',
                cravingScore: 2,
                cravingStimulus: 'ไม่มี',
                substanceStatus: 'ไม่กลับไปใช้สารเสพติด',
                riskGroupStatus: 'ไม่พบกลุ่มเสี่ยง',
                familySupport: 'ได้',
                lifestyleStatus: 'ปกติ',
                recommendations: ['เสริมแรงเชิงบวก', 'ทบทวนการรับประทานยา'],
                riskLevel: 'สีเขียว',
                riskReason: 'ผู้ป่วยอาการคงที่ ให้ความร่วมมือดี',
                nextAppDate: '2026-05-10',
                nextAppTime: '09:00',
                nurseName: 'พว.พลรุ่ง ใจดี',
                nursePosition: 'พยาบาลวิชาชีพ',
                appointmentStatus: 'มาตามนัด',
                reAdmit: 'ไม่มี',
                completedProgram: false
            }
        ]);

        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('yasothon_')) {
                patients = getStorageData('patients', patients);
                trackings = getStorageData('trackings', trackings);
                render();
            }
        });
        window.addEventListener('storage-sync', () => {
            patients = getStorageData('patients', patients);
            trackings = getStorageData('trackings', trackings);
            render();
        });

        const thaiMonths = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];

        function formatThaiDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            const day = d.getDate();
            const month = thaiMonths[d.getMonth()];
            const year = d.getFullYear() + 543;
            return `${day} ${month} ${year}`;
        }

        function formatThaiMonthYear(yearMonthStr) {
            if (!yearMonthStr) return '-';
            const parts = yearMonthStr.split('-');
            if (parts.length !== 2) return yearMonthStr;
            const y = parseInt(parts[0]) + 543;
            const m = parseInt(parts[1]) - 1;
            return `${thaiMonths[m] || ''} ${y}`;
        }

        function renderThaiDatePicker(name, id, value = '') {
            let d = value ? new Date(value) : new Date();
            let day = isNaN(d) ? new Date().getDate() : d.getDate();
            let month = isNaN(d) ? new Date().getMonth() + 1 : d.getMonth() + 1;
            let year = isNaN(d) ? new Date().getFullYear() + 543 : d.getFullYear() + 543;

            let dayOptions = '';
            for (let i = 1; i <= 31; i++) {
                dayOptions += `<option value="${i}" ${i === day ? 'selected' : ''}>${i}</option>`;
            }
            let monthOptions = '';
            thaiMonths.forEach((mName, idx) => {
                let mVal = idx + 1;
                monthOptions += `<option value="${mVal}" ${mVal === month ? 'selected' : ''}>${mName}</option>`;
            });
            let yearOptions = '';
            let currentYearBE = new Date().getFullYear() + 543;
            for (let y = currentYearBE - 2; y <= currentYearBE + 5; y++) {
                yearOptions += `<option value="${y}" ${y === year ? 'selected' : ''}>พ.ศ. ${y}</option>`;
            }

            return `
                <div class="grid grid-cols-3 gap-2 thai-date-picker" data-field-id="${id}">
                    <select class="px-2 py-2 rounded-xl border border-pastel-300 bg-pastel-50 text-sm focus:outline-none focus:ring-2 focus:ring-pastel-400 t-day">
                        <option value="">วัน</option>
                        ${dayOptions}
                    </select>
                    <select class="px-2 py-2 rounded-xl border border-pastel-300 bg-pastel-50 text-sm focus:outline-none focus:ring-2 focus:ring-pastel-400 t-month">
                        <option value="">เดือน</option>
                        ${monthOptions}
                    </select>
                    <select class="px-2 py-2 rounded-xl border border-pastel-300 bg-pastel-50 text-sm focus:outline-none focus:ring-2 focus:ring-pastel-400 t-year">
                        <option value="">ปี พ.ศ.</option>
                        ${yearOptions}
                    </select>
                    <input type="hidden" id="${id}" name="${name}" value="${value}">
                </div>
            `;
        }

        function initThaiDatePickers() {
            document.querySelectorAll('.thai-date-picker').forEach(picker => {
                const hiddenInputId = picker.getAttribute('data-field-id');
                const hiddenInput = document.getElementById(hiddenInputId);
                const updateHidden = () => {
                    const d = picker.querySelector('.t-day').value;
                    const m = picker.querySelector('.t-month').value;
                    const y = picker.querySelector('.t-year').value;
                    if (d && m && y) {
                        const ceYear = parseInt(y) - 543;
                        hiddenInput.value = `${ceYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    } else {
                        hiddenInput.value = '';
                    }
                };
                picker.querySelectorAll('select').forEach(sel => {
                    sel.addEventListener('change', updateHidden);
                });
            });
        }

        function showModal(htmlContent, onClose = null) {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            content.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            window.modalOnClose = onClose;
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.classList.add('hidden');
            if (window.modalOnClose) {
                window.modalOnClose();
                window.modalOnClose = null;
            }
        }

        function showAlert(title, message, type = 'info') {
            let bgIcon = type === 'error' ? 'bg-rose-100 text-rose-600' : 'bg-purple-100 text-purple-600';
            let iconName = type === 'error' ? 'alert-circle' : 'check-circle';
            let html = `
                <div class="w-16 h-16 mx-auto mb-4 rounded-full ${bgIcon} flex items-center justify-center">
                    <i data-lucide="${iconName}" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">${title}</h3>
                <p class="text-gray-600 mb-6 whitespace-pre-line">${message}</p>
                <button onclick="closeModal()" class="w-full py-3 bg-pastel-600 hover:bg-pastel-700 text-white font-semibold rounded-2xl shadow-lg transition-all">
                    ตกลง
                </button>
            `;
            showModal(html);
            lucide.createIcons();
        }

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginScreen();
            } else {
                app.innerHTML = renderMainLayout();
            }
            lucide.createIcons();
            initThaiDatePickers();
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-pastel-100 via-purple-50 to-pastel-200 p-4">
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-pastel-200 max-w-md w-full p-8 text-center relative overflow-hidden">
                        <div class="w-20 h-20 bg-pastel-200 text-pastel-700 rounded-3xl mx-auto flex items-center justify-center mb-4 shadow-inner">
                            <i data-lucide="heart-pulse" class="w-10 h-10"></i>
                        </div>
                        <span class="inline-block px-3 py-1 bg-pastel-100 text-pastel-800 rounded-full text-xs font-semibold mb-2">โรงพยาบาลยโสธร</span>
                        <h1 class="text-2xl font-bold text-gray-800 mb-1">ระบบการติดตามผู้ป่วยจิตเวชหลังจำหน่าย</h1>
                        <p class="text-xs text-gray-500 mb-6">กรุณาเข้าสู่ระบบเพื่อใช้งาน (Real-time Syncing)</p>

                        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                                <input type="text" id="loginUser" required placeholder="Ployrung หรือ ning" 
                                    class="w-full px-4 py-3 rounded-2xl border border-pastel-300 focus:outline-none focus:ring-2 focus:ring-pastel-500 text-sm bg-pastel-50/50">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                                <input type="password" id="loginPass" required placeholder="รหัสผ่าน" 
                                    class="w-full px-4 py-3 rounded-2xl border border-pastel-300 focus:outline-none focus:ring-2 focus:ring-pastel-500 text-sm bg-pastel-50/50">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-pastel-600 hover:bg-pastel-700 text-white font-bold rounded-2xl shadow-lg transition-all">
                                เข้าสู่ระบบ
                            </button>
                        </form>

                        <div class="mt-6 pt-6 border-t border-gray-100 text-xs text-gray-500 space-y-1">
                            <p class="font-semibold text-gray-600">รหัสทดสอบด่วน:</p>
                            <p>1. User: <span class="font-mono bg-pastel-100 text-purple-800 px-1 py-0.5 rounded">Ployrung</span> | Pass: <span class="font-mono bg-pastel-100 text-purple-800 px-1 py-0.5 rounded">1106</span></p>
                            <p>2. User: <span class="font-mono bg-pastel-100 text-purple-800 px-1 py-0.5 rounded">ning</span> | Pass: <span class="font-mono bg-pastel-100 text-purple-800 px-1 py-0.5 rounded">1212</span></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            if (USERS[u] && USERS[u].pass === p) {
                currentUser = { username: u, ...USERS[u] };
                localStorage.setItem('yasothon_user', JSON.stringify(currentUser));
                render();
            } else {
                showAlert('เข้าสู่ระบบไม่สำเร็จ', 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง', 'error');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('yasothon_user');
            render();
        }

        function renderMainLayout() {
            return `
                <div class="min-h-screen flex flex-col md:flex-row bg-[#f7f2fb]">
                    <aside class="w-full md:w-72 bg-white border-r border-pastel-200 flex flex-col shadow-sm">
                        <div class="p-6 border-b border-pastel-100 flex items-center space-x-3 bg-pastel-50/50">
                            <div class="w-12 h-12 bg-pastel-600 text-white rounded-2xl flex items-center justify-center shadow-md">
                                <i data-lucide="activity" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-gray-800 text-sm leading-tight">รพ.ยโสธร</h2>
                                <p class="text-xs text-purple-600 font-medium">ติดตามผู้ป่วยจิตเวช</p>
                            </div>
                        </div>

                        <div class="px-4 py-3 bg-pastel-100/60 m-4 rounded-2xl border border-pastel-200 text-xs">
                            <div class="text-purple-900 font-semibold mb-0.5 flex items-center">
                                <i data-lucide="hospital" class="w-3.5 h-3.5 mr-1 text-pastel-600"></i> สังกัดหน่วยงาน
                            </div>
                            <div class="text-gray-700 font-bold">${currentUser.ward}</div>
                            <div class="text-[10px] text-gray-500 mt-1 flex items-center justify-between">
                                <span>ผู้ใช้งาน: ${currentUser.username}</span>
                                <span class="flex items-center text-emerald-600 font-semibold"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1 animate-pulse"></span> เรียลไทม์ (Live Sync)</span>
                            </div>
                        </div>

                        <nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar pb-6">
                            <div class="text-[11px] font-bold text-gray-400 uppercase px-3 py-2">เมนูหลัก</div>
                            
                            <button onclick="switchTab('dashboard')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'dashboard' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                                <span>1. แดชบอร์ด</span>
                            </button>

                            <button onclick="switchTab('register')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'register' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                <i data-lucide="user-plus" class="w-5 h-5"></i>
                                <span>2. ลงทะเบียนผู้ป่วย</span>
                            </button>

                            <div class="space-y-1">
                                <button onclick="switchTab('tracking')" class="w-full flex items-center justify-between px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'tracking' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                    <div class="flex items-center space-x-3">
                                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                                        <span>3. การติดตาม</span>
                                    </div>
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </button>
                                ${currentTab === 'tracking' ? `
                                    <div class="pl-8 space-y-1 pt-1">
                                        <button onclick="switchSubTab('daily')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition-all ${currentSubTab === 'daily' ? 'bg-pastel-200 text-purple-900 font-bold' : 'text-gray-600 hover:bg-pastel-50'}">
                                            • 3.1 ติดตามรายวัน
                                        </button>
                                        <button onclick="switchSubTab('program')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition-all ${currentSubTab === 'program' ? 'bg-pastel-200 text-purple-900 font-bold' : 'text-gray-600 hover:bg-pastel-50'}">
                                            • 3.2 ติดตามครบโปรแกรม
                                        </button>
                                    </div>
                                ` : ''}
                            </div>

                            <button onclick="switchTab('monthly')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'monthly' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                <i data-lucide="calendar-range" class="w-5 h-5"></i>
                                <span>4. ยอดประจำเดือน</span>
                            </button>

                            <button onclick="switchTab('summary')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'summary' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                <i data-lucide="file-text" class="w-5 h-5"></i>
                                <span>5. สรุปผล</span>
                            </button>

                            <button onclick="switchTab('patients')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'patients' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                <i data-lucide="users" class="w-5 h-5"></i>
                                <span>6. ข้อมูลผู้ป่วย</span>
                            </button>

                            <button onclick="switchTab('settings')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl font-medium text-sm transition-all ${currentTab === 'settings' ? 'bg-pastel-600 text-white shadow-md' : 'text-gray-600 hover:bg-pastel-50 hover:text-purple-700'}">
                                <i data-lucide="settings" class="w-5 h-5"></i>
                                <span>7. ตั้งค่า</span>
                            </button>
                        </nav>

                        <div class="p-4 border-t border-pastel-100">
                            <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold rounded-2xl text-sm transition-all">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                                <span>ออกจากระบบ</span>
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">

        function renderTabContent() {
            const container = document.getElementById('tabContent');

            const titles = {

                register: 'ลงทะเบียนผู้ป่วยใหม่',

                monthly: 'ยอดผู้ป่วยจำหน่ายประจำเดือน',
                summary: 'สรุปผลการติดตามประจำวัน',
                patients: 'ค้นหาและจัดการข้อมูลผู้ป่วยทั้งหมด',
                settings: 'ตั้งค่าและจัดการข้อมูลผู้ป่วย (แก้ไข/ลบ)'
            };
            const titleEl = document.getElementById('pageTitle');
            if (titleEl) titleEl.innerText = titles[currentTab] || '';

            if (currentTab === 'dashboard') container.innerHTML = renderDashboardView();
            else if (currentTab === 'register') container.innerHTML = renderRegisterView();
            else if (currentTab === 'tracking') {
                if (currentSubTab === 'daily') container.innerHTML = renderDailyTrackingView();
                else container.innerHTML = renderCompletedProgramView();
            }
            else if (currentTab === 'monthly') container.innerHTML = renderMonthlyView();
            else if (currentTab === 'summary') container.innerHTML = renderSummaryView();
            else if (currentTab === 'patients') container.innerHTML = renderPatientsView();
            else if (currentTab === 'settings') container.innerHTML = renderSettingsView();

            lucide.createIcons();
            initThaiDatePickers();
            if (currentTab === 'dashboard') initDashboardCharts();
        }

        function initDashboardCharts() {
            const canvas = document.getElementById('dashboardPieChart');

            const wardPatients = patients.filter(p => p.ward === currentUser.code);
            const wardTrackings = trackings.filter(t => t.ward === currentUser.code);
            const now = new Date();
            const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const selectedMonth = window.dashboardSelectedMonth || currentYearMonth;

            const dCount = wardPatients.filter(p => p.dischargeDate && p.dischargeDate.startsWith(selectedMonth)).length;
            const aCount = wardPatients.filter(p => p.appointmentDate && p.appointmentDate.startsWith(selectedMonth)).length;
            const rCount = wardTrackings.filter(t => t.trackingDate && t.trackingDate.startsWith(selectedMonth) && t.reAdmit && t.reAdmit !== 'ไม่มี').length;

            new Chart(canvas, {
                type: 'pie',

                    labels: ['ยอดผู้ป่วยจำหน่าย', 'ยอดผู้ป่วยมาตามนัด', 'ยอดผู้ป่วย Re Admit'],

                    maintainAspectRatio: false,

                    }
                }
            });
        }

        function handleRegisterPatient(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const address = document.getElementById('regAddress').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const healthCenter = document.getElementById('regHealthCenter').value.trim();
            const sequence = document.getElementById('regSequence').value.trim();
            const dischargeDate = document.getElementById('regDischargeDate').value;
            const appointmentDate = document.getElementById('regAppointmentDate').value;
            const fu1Date = document.getElementById('regFu1Date').value;
            const fu2Date = document.getElementById('regFu2Date').value;
            const fu3Date = document.getElementById('regFu3Date').value;
            const fu4Date = document.getElementById('regFu4Date').value;

            const fields = [
                { name: '1. ชื่อ - นามสกุล', val: name },
                { name: '2. ที่อยู่', val: address },
                { name: '3. เบอร์โทรศัพท์', val: phone },
                { name: '4. รพ.สต. / อนามัยใกล้บ้าน', val: healthCenter },
                { name: '5. วันที่จำหน่าย', val: dischargeDate },
                { name: '6. วันที่นัดติดตาม', val: appointmentDate },
                { name: '7. ติดตามครั้งที่ 1', val: fu1Date },
                { name: '8. ติดตามครั้งที่ 2', val: fu2Date },
                { name: '9. ติดตามครั้งที่ 3', val: fu3Date },
                { name: '10. ติดตามครั้งที่ 4', val: fu4Date },
                { name: '11. ลำดับในใบติดตาม', val: sequence }
            ];

            const missing = fields.filter(f => !f.val);
            if (missing.length > 0) {
                showAlert('กรอกข้อมูลไม่ครบถ้วน', `กรุณากรอกข้อมูลให้ครบถ้วน:\n• ${missing.map(m => m.name).join('\n• ')}`, 'error');
                return;
            }

            const newPatient = {
                id: 'P-' + Date.now(),
                ward: currentUser.code,
                name, address, phone, healthCenter,
                dischargeDate, appointmentDate, fu1Date, fu2Date, fu3Date, fu4Date, sequence,
                createdAt: new Date().toISOString().split('T')[0]
            };

            patients.push(newPatient);
            setStorageData('patients', patients);

            showAlert('บันทึกสำเร็จ!', 'ลงทะเบียนผู้ป่วยและซิงค์ข้อมูลเรียบร้อยแล้วทุกอุปกรณ์ 🎉', 'success');
            document.getElementById('registerForm').reset();
            switchTab('patients');
        }

                            </div>
                            <div>
                                <label class="block font-semibold text-gray-700">ครั้งที่ติดตาม:</label>
                                <select id="trackFuNumber" class="w-full px-3 py-2 bg-white rounded-xl border font-semibold text-purple-800">
                                    <option value="1">ครั้งที่ 1</option>
                                    <option value="2">ครั้งที่ 2</option>
                                    <option value="3">ครั้งที่ 3</option>
                                    <option value="4">ครั้งที่ 4</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold text-gray-700">เวลาติดตาม:</label>
                                <input type="time" id="trackTime" value="${new Date().toTimeString().substring(0,5)}" class="w-full px-3 py-2 bg-white rounded-xl border">
                            </div>
                        </div>

                        <div class="p-4 bg-white rounded-2xl border border-pastel-200 shadow-sm space-y-3">
                            <h4 class="font-bold text-purple-800">1. การรับประทานยา</h4>
                            <div class="flex gap-4">
                                <label><input type="radio" name="medStatus" value="รับประทานครบ" checked> รับประทานครบ</label>
                                <label><input type="radio" name="medStatus" value="ลืมบางครั้ง"> ลืมบางครั้ง</label>
                                <label><input type="radio" name="medStatus" value="ไม่รับประทาน"> ไม่รับประทาน</label>
                            </div>
                        </div>

                        <div class="p-5 bg-purple-50 rounded-2xl border-2 border-pastel-300 shadow-sm space-y-4">
                            <h4 class="font-bold text-purple-900">หัวข้อการติดตามเพิ่มเติม (Real-time Sync)</h4>
                            <div>
                                <label class="block font-semibold text-gray-700 mb-1">1. สถานะการมาตามนัด:</label>
                                <div class="flex gap-4">
                                    <label><input type="radio" name="appointmentStatus" value="มาตามนัด" checked> มาตามนัด</label>
                                    <label><input type="radio" name="appointmentStatus" value="ไม่มาตามนัด"> ไม่มาตามนัด</label>
                                </div>
                            </div>
                            <div>
                                <label class="block font-semibold text-gray-700 mb-1">2. ผู้ป่วย Re Admit:</label>
                                <input type="text" id="trackReAdmit" value="ไม่มี" class="w-full px-3 py-2 rounded-xl border border-pastel-300 bg-white text-sm">
                            </div>
                            <div>
                                <label class="flex items-center space-x-3 cursor-pointer">
                                    <input type="checkbox" id="trackCompletedProgram" class="w-5 h-5 text-pastel-600 rounded">
                                    <span class="font-bold text-purple-900 text-base">3. บันทึกสถานะ "ครบโปรแกรมการติดตาม" แล้ว</span>
                                </label>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" class="px-8 py-3.5 bg-pastel-600 hover:bg-pastel-700 text-white font-bold rounded-2xl shadow-lg">
                                บันทึกและซิงค์ข้อมูลทันที
                            </button>
                        </div>
                    </form>
                </div>
            `;
            showModal(html);
        }

        function saveTrackingRecord(e, patientId, dateStr) {
            e.preventDefault();

            const newRecord = {
                id: 'T-' + Date.now(),
                patientId,
                ward: currentUser.code,
                fuNumber: document.getElementById('trackFuNumber').value,
                trackingDate: dateStr,
                time: document.getElementById('trackTime').value,
                medStatus: document.querySelector('input[name="medStatus"]:checked').value,
                appointmentStatus: document.querySelector('input[name="appointmentStatus"]:checked').value,
                reAdmit: document.getElementById('trackReAdmit').value.trim() || 'ไม่มี',
                completedProgram: document.getElementById('trackCompletedProgram').checked,
                nurseName: `พว. ${currentUser.username}`,
                updatedAt: new Date().toISOString()
            };

            trackings.push(newRecord);
            setStorageData('trackings', trackings);

            closeModal();
            showAlert('บันทึกสำเร็จ!', 'บันทึกและซิงค์ข้อมูลเรียบร้อยแล้วทุกอุปกรณ์ 🎉', 'success');
            renderTabContent();
        }

        function renderCompletedProgramView() {
            const wardPatients = patients.filter(p => p.ward === currentUser.code);
            const completedPatientIds = new Set(
                trackings.filter(t => t.ward === currentUser.code && t.completedProgram).map(t => t.patientId)
            );
            const completedPatients = wardPatients.filter(p => completedPatientIds.has(p.id));

            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200">
                        <h3 class="font-bold text-gray-800 mb-4 flex items-center">
                            <i data-lucide="award" class="w-5 h-5 mr-2 text-pastel-600"></i> รายชื่อผู้ป่วยที่ติดตามครบโปรแกรม (${completedPatients.length} คน) - Live Sync
                        </h3>
                        ${completedPatients.length === 0 ? `
                            <p class="text-gray-500 text-center py-12">ยังไม่มีผู้ป่วยที่บันทึกสถานะครบโปรแกรมในระบบ</p>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr class="bg-pastel-100/60 text-purple-900 border-b border-pastel-200">
                                            <th class="p-3.5 rounded-l-2xl">ชื่อผู้ป่วย</th>
                                            <th class="p-3.5">ที่อยู่</th>
                                            <th class="p-3.5">เบอร์โทร</th>
                                            <th class="p-3.5 text-center rounded-r-2xl">สถานะ</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-pastel-100">
                                        ${completedPatients.map(p => `
                                            <tr class="hover:bg-pastel-50/50">
                                                <td class="p-3.5 font-bold text-gray-800">${p.name}</td>
                                                <td class="p-3.5 text-gray-600 text-xs">${p.address}</td>
                                                <td class="p-3.5 text-gray-600">${p.phone}</td>
                                                <td class="p-3.5 text-center">
                                                    <span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">✓ ครบโปรแกรม</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderMonthlyView() {
            const wardPatients = patients.filter(p => p.ward === currentUser.code);
            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200 flex justify-between items-center">
                        <h3 class="font-bold text-gray-800">ยอดผู้ป่วยจำหน่ายประจำเดือน (ซิงค์ข้อมูลอัตโนมัติ)</h3>
                        <button onclick="exportMonthlyExcel()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Export Excel</button>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200">
                        <table class="w-full text-left text-sm">
                            <thead><tr class="bg-pastel-100 text-purple-900"><th class="p-3">ลำดับ</th><th class="p-3">ชื่อ</th><th class="p-3">เบอร์โทร</th><th class="p-3">รพ.สต.</th></tr></thead>
                            <tbody>
                                ${wardPatients.map(p => `<tr class="border-b"><td class="p-3">${p.sequence||'-'}</td><td class="p-3 font-bold">${p.name}</td><td class="p-3">${p.phone}</td><td class="p-3">${p.healthCenter}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function exportMonthlyExcel() {
            const wardPatients = patients.filter(p => p.ward === currentUser.code);
            const data = wardPatients.map((p, i) => ({ 'ลำดับ': p.sequence || (i+1), 'ชื่อ': p.name, 'เบอร์โทร': p.phone, 'รพ.สต.': p.healthCenter }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Patients");
            XLSX.writeFile(wb, "yasothon_patients.xlsx");
        }

        function renderSummaryView() { return `<div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200"><h3 class="font-bold">สรุปผลการติดตามประจำวัน (Live Sync)</h3></div>`; }
        function renderPatientsView() {
            const wardPatients = patients.filter(p => p.ward === currentUser.code);
            return `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200 space-y-4">
                    <h3 class="font-bold text-gray-800">รายชื่อผู้ป่วยทั้งหมดในระบบ (${wardPatients.length} คน)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${wardPatients.map(p => `<div class="p-4 bg-pastel-50 rounded-xl border border-pastel-200"><h4 class="font-bold text-purple-900">${p.name}</h4><p class="text-xs text-gray-600">โทร: ${p.phone} \vert{} รพ.สต.: ${p.healthCenter}</p></div>`).join('')}
                    </div>
                </div>
            `;
        }
        function renderSettingsView() { return `<div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200"><h3 class="font-bold">ตั้งค่าและจัดการระบบ</h3></div>`; }

        window.onload = function() {
            render();
            if (currentUser) renderTabContent();
        }
    </script>
</body>
</html>
