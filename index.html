            'ning': { pass: '1212', ward: 'หอผู้ป่วยสุขใจ IMC โรงพยาบาลยโสธร', code: 'sukjai_imc' }

        let currentTab = localStorage.getItem('yasothon_tab') || 'dashboard';

        function getStorageData(key, defaultVal) {

        function setStorageData(key, val) {

                fu2Date: '2026-05-10',

                phone: '0898765432',
                healthCenter: 'รพ.สต.เขื่องใน',
                dischargeDate: '2026-05-05',
                appointmentDate: '2026-05-20',
                fu1Date: '2026-05-07',
                fu2Date: '2026-05-14',

                fu4Date: '2026-06-11',

            }
        ]);

                reAdmit: 'ไม่มี',
                completedProgram: false

        ]);

        // Sync listener across tabs/devices
        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('yasothon_')) {
                patients = getStorageData('patients', patients);
                trackings = getStorageData('trackings', trackings);
                render();
            }
        });
        window.addEventListener('storage-sync', () => {
            patients = getStorageData('patients', patients);
            trackings = getStorageData('trackings', trackings);
            render();
        });

        // --- Thai Date Helpers ---
        const thaiMonths = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];

        function formatThaiDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            const day = d.getDate();
            const month = thaiMonths[d.getMonth()];
            const year = d.getFullYear() + 543;
            return `${day} ${month} ${year}`;
        }

        function formatThaiMonthYear(yearMonthStr) {
            // format YYYY-MM
            if (!yearMonthStr) return '-';
            const parts = yearMonthStr.split('-');
            if (parts.length !== 2) return yearMonthStr;
            const y = parseInt(parts[0]) + 543;
            const m = parseInt(parts[1]) - 1;
            return `${thaiMonths[m] || ''} ${y}`;
        }

        // Render Thai Date Picker Component HTML
        function renderThaiDatePicker(name, id, value = '') {
            let d = value ? new Date(value) : new Date();
            let day = isNaN(d) ? new Date().getDate() : d.getDate();
            let month = isNaN(d) ? new Date().getMonth() + 1 : d.getMonth() + 1;
            let year = isNaN(d) ? new Date().getFullYear() + 543 : d.getFullYear() + 543;

            let dayOptions = '';
            for (let i = 1; i <= 31; i++) {
                dayOptions += `<option value="${i}" ${i === day ? 'selected' : ''}>${i}</option>`;
            }
            let monthOptions = '';
            thaiMonths.forEach((mName, idx) => {
                let mVal = idx + 1;
                monthOptions += `<option value="${mVal}" ${mVal === month ? 'selected' : ''}>${mName}</option>`;
            });
            let yearOptions = '';
            let currentYearBE = new Date().getFullYear() + 543;
            for (let y = currentYearBE - 2; y <= currentYearBE + 5; y++) {
                yearOptions += `<option value="${y}" ${y === year ? 'selected' : ''}>พ.ศ. ${y}</option>`;
            }

            return `
                <div class="grid grid-cols-3 gap-2 thai-date-picker" data-field-id="${id}">
                    <select class="px-2 py-2 rounded-xl border border-pastel-300 bg-pastel-50 text-sm focus:outline-none focus:ring-2 focus:ring-pastel-400 t-day">
                        <option value="">วัน</option>
                        ${dayOptions}
                    </select>
                    <select class="px-2 py-2 rounded-xl border border-pastel-300 bg-pastel-50 text-sm focus:outline-none focus:ring-2 focus:ring-pastel-400 t-month">
                        <option value="">เดือน</option>
                        ${monthOptions}
                    </select>
                    <select class="px-2 py-2 rounded-xl border border-pastel-300 bg-pastel-50 text-sm focus:outline-none focus:ring-2 focus:ring-pastel-400 t-year">
                        <option value="">ปี พ.ศ.</option>
                        ${yearOptions}
                    </select>
                    <input type="hidden" id="${id}" name="${name}" value="${value}">
                </div>
            `;
        }

        // Helper to extract date value from thai date picker container
        function getThaiDatePickerValue(containerId) {
            const container = document.querySelector(`[data-field-id="${containerId}"]`);
            if (!container) return '';
            const d = container.querySelector('.t-day').value;
            const m = container.querySelector('.t-month').value;
            const y = container.querySelector('.t-year').value;
            if (!d || !m || !y) return '';
            const ceYear = parseInt(y) - 543;
            const formattedMonth = String(m).padStart(2, '0');
            const formattedDay = String(d).padStart(2, '0');
            return `${ceYear}-${formattedMonth}-${formattedDay}`;
        }

        // Attach change listeners to update hidden inputs
        function initThaiDatePickers() {
            document.querySelectorAll('.thai-date-picker').forEach(picker => {
                const hiddenInputId = picker.getAttribute('data-field-id');
                const hiddenInput = document.getElementById(hiddenInputId);
                const updateHidden = () => {
                    const d = picker.querySelector('.t-day').value;
                    const m = picker.querySelector('.t-month').value;
                    const y = picker.querySelector('.t-year').value;
                    if (d && m && y) {
                        const ceYear = parseInt(y) - 543;
                        hiddenInput.value = `${ceYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    } else {
                        hiddenInput.value = '';
                    }
                };
                picker.querySelectorAll('select').forEach(sel => {
                    sel.addEventListener('change', updateHidden);
                });
            });
        }

        // --- Custom Modal ---
        function showModal(htmlContent, onClose = null) {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            content.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            window.modalOnClose = onClose;
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.classList.add('hidden');
            if (window.modalOnClose) {
                window.modalOnClose();
                window.modalOnClose = null;
            }
        }

        function showAlert(title, message, type = 'info') {
            let bgIcon = type === 'error' ? 'bg-rose-100 text-rose-600' : 'bg-purple-100 text-purple-600';
            let iconName = type === 'error' ? 'alert-circle' : 'check-circle';
            let html = `
                <div class="w-16 h-16 mx-auto mb-4 rounded-full ${bgIcon} flex items-center justify-center">
                    <i data-lucide="${iconName}" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">${title}</h3>
                <p class="text-gray-600 mb-6 whitespace-pre-line">${message}</p>
                <button onclick="closeModal()" class="w-full py-3 bg-pastel-600 hover:bg-pastel-700 text-white font-semibold rounded-2xl shadow-lg transition-all">
                    ตกลง
                </button>
            `;
            showModal(html);
            lucide.createIcons();
        }

        // --- Render Main Router ---
        function render() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginScreen();
            } else {
                app.innerHTML = renderMainLayout();
            }
            lucide.createIcons();
            initThaiDatePickers();
        }

        // --- Login Screen ---
        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-pastel-100 via-purple-50 to-pastel-200 p-4">
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-pastel-200 max-w-md w-full p-8 text-center relative overflow-hidden">
                        <div class="absolute -top-12 -right-12 w-32 h-32 bg-pastel-300 rounded-full opacity-30 pointer-events-none"></div>
                        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-300 rounded-full opacity-30 pointer-events-none"></div>

                        <div class="w-20 h-20 bg-pastel-200 text-pastel-700 rounded-3xl mx-auto flex items-center justify-center mb-4 shadow-inner">

                        </div>
                        <span class="inline-block px-3 py-1 bg-pastel-100 text-pastel-800 rounded-full text-xs font-semibold mb-2">โรงพยาบาลยโสธร</span>
                        <h1 class="text-2xl font-bold text-gray-800 mb-1">ระบบการติดตามผู้ป่วยจิตเวชหลังจำหน่าย</h1>
                        <p class="text-xs text-gray-500 mb-6">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>

                        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                        <i data-lucide="user" class="w-5 h-5"></i>
                                    </span>
                                    <input type="text" id="loginUser" required placeholder="ระบุชื่อผู้ใช้งาน เช่น Ployrung" 
                                        class="w-full pl-10 pr-4 py-3 rounded-2xl border border-pastel-300 focus:outline-none focus:ring-2 focus:ring-pastel-500 text-sm bg-pastel-50/50">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                        <i data-lucide="lock" class="w-5 h-5"></i>
                                    </span>
                                    <input type="password" id="loginPass" required placeholder="ระบุรหัสผ่าน" 
                                        class="w-full pl-10 pr-4 py-3 rounded-2xl border border-pastel-300 focus:outline-none focus:ring-2 focus:ring-pastel-500 text-sm bg-pastel-50/50">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-pastel-600 hover:bg-pastel-700 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:-translate-y-0.5">
                                เข้าสู่ระบบ
                            </button>
                        </form>

                        <div class="mt-6 pt-6 border-t border-gray-100 text-xs text-gray-500 space-y-1">
                            <p class="font-semibold text-gray-600">รหัสทดสอบด่วน:</p>
                            <p>1. User: <span class="font-mono bg-pastel-100 text-purple-800 px-1.5 py-0.5 rounded">Ployrung</span> | Pass: <span class="font-mono bg-pastel-100 text-purple-800 px-1.5 py-0.5 rounded">1106</span> (หอผู้ป่วยสุขใจ)</p>
                            <p>2. User: <span class="font-mono bg-pastel-100 text-purple-800 px-1.5 py-0.5 rounded">ning</span> | Pass: <span class="font-mono bg-pastel-100 text-purple-800 px-1.5 py-0.5 rounded">1212</span> (หอผู้ป่วยสุขใจ IMC)</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            if (USERS[u] && USERS[u].pass === p) {
                currentUser = { username: u, ...USERS[u] };
                localStorage.setItem('yasothon_user', JSON.stringify(currentUser));
                render();
            } else {
                showAlert('เข้าสู่ระบบไม่สำเร็จ', 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง', 'error');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('yasothon_user');
            render();
        }

                                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                                <span>1. แดชบอร์ด</span>
                            </button>

                                <i data-lucide="user-plus" class="w-5 h-5"></i>
                                <span>2. ลงทะเบียนผู้ป่วย</span>
                            </button>

        // --- Render Tab Content Router ---
        function renderTabContent() {
            const container = document.getElementById('tabContent');
            if (!container) return;

            const titles = {
                dashboard: 'แดชบอร์ดสรุปข้อมูลผู้ป่วยจิตเวช',
                register: 'ลงทะเบียนผู้ป่วยใหม่',
                tracking: currentSubTab === 'daily' ? 'การติดตามรายวัน' : 'การติดตามครบโปรแกรม',
                monthly: 'ยอดผู้ป่วยจำหน่ายประจำเดือน',
                summary: 'สรุปผลการติดตามประจำวัน',
                patients: 'ค้นหาและจัดการข้อมูลผู้ป่วยทั้งหมด',
                settings: 'ตั้งค่าและจัดการข้อมูลผู้ป่วย (แก้ไข/ลบ)'
            };
            const titleEl = document.getElementById('pageTitle');
            if (titleEl) titleEl.innerText = titles[currentTab] || '';

            if (currentTab === 'dashboard') container.innerHTML = renderDashboardView();
            else if (currentTab === 'register') container.innerHTML = renderRegisterView();
            else if (currentTab === 'tracking') {
                if (currentSubTab === 'daily') container.innerHTML = renderDailyTrackingView();
                else container.innerHTML = renderCompletedProgramView();
            }
            else if (currentTab === 'monthly') container.innerHTML = renderMonthlyView();
            else if (currentTab === 'summary') container.innerHTML = renderSummaryView();
            else if (currentTab === 'patients') container.innerHTML = renderPatientsView();
            else if (currentTab === 'settings') container.innerHTML = renderSettingsView();

            lucide.createIcons();
            initThaiDatePickers();
            if (currentTab === 'dashboard') initDashboardCharts();
        }

            const monthlyDischarges = wardPatients.filter(p => p.dischargeDate && p.dischargeDate.startsWith(selectedMonth));

                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200 flex items-center space-x-4">

        function initDashboardCharts() {

            const wardTrackings = trackings.filter(t => t.ward === currentUser.code);
            const now = new Date();
            const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const selectedMonth = window.dashboardSelectedMonth || currentYearMonth;

            const dCount = wardPatients.filter(p => p.dischargeDate && p.dischargeDate.startsWith(selectedMonth)).length;
            const aCount = wardPatients.filter(p => p.appointmentDate && p.appointmentDate.startsWith(selectedMonth)).length;

                    labels: ['ยอดผู้ป่วยจำหน่าย', 'ยอดผู้ป่วยมาตามนัด', 'ยอดผู้ป่วย Re Admit'],

                    }
                }

        }

        function handleRegisterPatient(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const address = document.getElementById('regAddress').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const healthCenter = document.getElementById('regHealthCenter').value.trim();
            const sequence = document.getElementById('regSequence').value.trim();
            const dischargeDate = document.getElementById('regDischargeDate').value;
            const appointmentDate = document.getElementById('regAppointmentDate').value;
            const fu1Date = document.getElementById('regFu1Date').value;
            const fu2Date = document.getElementById('regFu2Date').value;
            const fu3Date = document.getElementById('regFu3Date').value;
            const fu4Date = document.getElementById('regFu4Date').value;

            // Validation check for all 11 fields
            const fields = [
                { name: '1. ชื่อ - นามสกุล', val: name },
                { name: '2. ที่อยู่', val: address },
                { name: '3. เบอร์โทรศัพท์', val: phone },
                { name: '4. รพ.สต. / อนามัยใกล้บ้าน', val: healthCenter },
                { name: '5. วันที่จำหน่าย', val: dischargeDate },
                { name: '6. วันที่นัดติดตาม', val: appointmentDate },
                { name: '7. ติดตามครั้งที่ 1', val: fu1Date },
                { name: '8. ติดตามครั้งที่ 2', val: fu2Date },
                { name: '9. ติดตามครั้งที่ 3', val: fu3Date },
                { name: '10. ติดตามครั้งที่ 4', val: fu4Date },
                { name: '11. ลำดับในใบติดตาม', val: sequence }
            ];

            const missing = fields.filter(f => !f.val);
            if (missing.length > 0) {
                showAlert('กรอกข้อมูลไม่ครบถ้วน', `กรุณากรอกข้อมูลให้ครบถ้วน ข้อมูลที่ยังไม่ได้กรอก:\n• ${missing.map(m => m.name).join('\n• ')}`, 'error');
                return;
            }

            const newPatient = {
                id: 'P-' + Date.now(),
                ward: currentUser.code,
                name, address, phone, healthCenter,
                dischargeDate, appointmentDate, fu1Date, fu2Date, fu3Date, fu4Date, sequence,
                createdAt: new Date().toISOString().split('T')[0]
            };

            patients.push(newPatient);
            setStorageData('patients', patients);

            showAlert('บันทึกสำเร็จ!', 'ลงทะเบียนผู้ป่วยและบันทึกข้อมูลในระบบเรียบร้อยแล้ว 🎉', 'success');
            document.getElementById('registerForm').reset();
            switchTab('patients');
        }

        function saveTrackingRecord(e, patientId, dateStr) {
            e.preventDefault();

            const fuNumber = document.getElementById('trackFuNumber').value;
            const time = document.getElementById('trackTime').value;
            const informant = document.querySelector('input[name="informant"]:checked').value;
            const channel = document.querySelector('input[name="channel"]:checked').value;
            const medStatus = document.querySelector('input[name="medStatus"]:checked').value;
            const medSide = document.querySelector('input[name="medSide"]:checked').value;
            const medSideText = document.getElementById('medSideText').value;
            const sleep = document.querySelector('input[name="sleep"]:checked').value;
            const mood = document.querySelector('input[name="mood"]:checked').value;
            const mental = document.querySelector('input[name="mental"]:checked').value;
            const cravingScore = parseInt(document.getElementById('cravingScore').value);
            const stimulus = document.querySelector('input[name="stimulus"]:checked').value;
            const substance = document.querySelector('input[name="substance"]:checked').value;
            const family = document.querySelector('input[name="family"]:checked').value;
            const lifestyle = document.querySelector('input[name="lifestyle"]:checked').value;
            
            const recs = [];
            document.querySelectorAll('input[name="rec"]:checked').forEach(cb => recs.push(cb.value));

            const riskLevel = document.querySelector('input[name="riskLevel"]:checked').value;
            const riskReason = document.getElementById('riskReason').value;
            const trackSummary = document.getElementById('trackSummary').value.trim();

            // Extra 3 questions
            const appointmentStatus = document.querySelector('input[name="appointmentStatus"]:checked').value;
            const reAdmit = document.getElementById('trackReAdmit').value.trim() || 'ไม่มี';
            const completedProgram = document.getElementById('trackCompletedProgram').checked;

            const nurseName = document.getElementById('nurseName').value;
            const nursePosition = document.getElementById('nursePosition').value;

            const newRecord = {
                id: 'T-' + Date.now(),
                patientId,
                ward: currentUser.code,
                fuNumber,
                trackingDate: dateStr,
                time,
                informant,
                channel,
                medStatus,
                medSideEffect: medSide === 'มี' ? medSideText : 'ไม่มี',
                sleepStatus: sleep,
                moodStatus: mood,
                mentalStatus: mental,
                cravingScore,
                cravingStimulus: stimulus,
                substanceStatus: substance,
                riskGroupStatus: 'ไม่พบกลุ่มเสี่ยง',
                familySupport: family,
                lifestyleStatus: lifestyle,
                recommendations: recs,
                riskLevel,
                riskReason,
                trackSummary,
                nurseName,
                nursePosition,
                appointmentStatus,
                reAdmit,
                completedProgram,
                updatedAt: new Date().toISOString()
            };

            trackings.push(newRecord);
            setStorageData('trackings', trackings);

            closeModal();
            showAlert('บันทึกสำเร็จ!', 'บันทึกข้อมูลผลการติดตามผู้ป่วยเรียบร้อยแล้ว 🎉', 'success');

        }

                                ${filtered.map(p => `
                                    <div class="p-5 rounded-2xl border border-pastel-200 bg-pastel-50/40 space-y-3">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <span class="text-xs font-bold bg-pastel-200 text-purple-900 px-2.5 py-1 rounded-full">ลำดับ ${p.sequence || '-'}</span>
                                                <h4 class="font-bold text-gray-800 text-base mt-2">${p.name}</h4>
                                            </div>
                                            <span class="text-xs text-gray-500">ลงทะเบียน: ${formatThaiDate(p.createdAt)}</span>
                                        </div>
                                        <div class="text-xs space-y-1 text-gray-600">
                                            <p><strong>ที่อยู่:</strong> ${p.address}</p>
                                            <p><strong>เบอร์โทร:</strong> ${p.phone}</p>
                                            <p><strong>รพ.สต.:</strong> ${p.healthCenter}</p>
                                            <p><strong>วันที่จำหน่าย:</strong> ${formatThaiDate(p.dischargeDate)}</p>
                                            <p><strong>วันนัดติดตาม:</strong> ${formatThaiDate(p.appointmentDate)}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // --- 7. Settings View (Edit & Delete Patient Records) ---
        function renderSettingsView() {
            const wardPatients = patients.filter(p => p.ward === currentUser.code);

            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-pastel-200">
                        <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-pastel-100">
                            <div class="w-10 h-10 bg-pastel-100 text-pastel-700 rounded-2xl flex items-center justify-center font-bold">
                                <i data-lucide="settings" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">จัดการข้อมูลผู้ป่วย (แก้ไข / ลบ)</h3>
                                <p class="text-xs text-gray-500">จัดการรายชื่อผู้ป่วยที่ลงทะเบียนในระบบ</p>
                            </div>
                        </div>

                        ${wardPatients.length === 0 ? `
                            <p class="text-gray-500 text-center py-12">ยังไม่มีข้อมูลผู้ป่วยในระบบ</p>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr class="bg-pastel-100/60 text-purple-900 border-b border-pastel-200">
                                            <th class="p-3.5 rounded-l-2xl">ลำดับ</th>
                                            <th class="p-3.5">ชื่อ-นามสกุล</th>
                                            <th class="p-3.5">เบอร์โทร</th>
                                            <th class="p-3.5">รพ.สต.</th>
                                            <th class="p-3.5">วันที่จำหน่าย</th>
                                            <th class="p-3.5 text-right rounded-r-2xl">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-pastel-100">
                                        ${wardPatients.map(p => `
                                            <tr class="hover:bg-pastel-50/50">
                                                <td class="p-3.5 font-semibold text-purple-800">${p.sequence || '-'}</td>
                                                <td class="p-3.5 font-bold text-gray-800">${p.name}</td>
                                                <td class="p-3.5 text-gray-600">${p.phone}</td>
                                                <td class="p-3.5 text-gray-600">${p.healthCenter}</td>
                                                <td class="p-3.5 text-gray-600">${formatThaiDate(p.dischargeDate)}</td>
                                                <td class="p-3.5 text-right space-x-2">
                                                    <button onclick="openEditPatientModal('${p.id}')" class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-xl text-xs font-bold transition-all">
                                                        แก้ไข
                                                    </button>
                                                    <button onclick="deletePatientRecord('${p.id}')" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-xl text-xs font-bold transition-all">
                                                        ลบ
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function deletePatientRecord(id) {
            if (confirm('คุณต้องการลบข้อมูลผู้ป่วยรายนี้ใช่หรือไม่?')) {
                patients = patients.filter(p => p.id !== id);
                setStorageData('patients', patients);
                showAlert('ลบสำเร็จ', 'ลบข้อมูลผู้ป่วยออกจากระบบเรียบร้อยแล้ว', 'success');
                renderTabContent();
            }
        }

        function openEditPatientModal(id) {
            const p = patients.find(item => item.id === id);
            if (!p) return;

            let html = `
                <div class="max-h-[80vh] overflow-y-auto custom-scrollbar text-left p-2 space-y-4">
                    <h3 class="text-lg font-bold text-gray-800 border-b border-pastel-200 pb-3">แก้ไขข้อมูลผู้ป่วย</h3>
                    <form id="editForm" onsubmit="saveEditPatient(event, '${id}')" class="space-y-4 text-sm">
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">ชื่อ - นามสกุล</label>
                            <input type="text" id="editName" value="${p.name}" required class="w-full px-3 py-2 rounded-xl border border-pastel-300">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์</label>
                            <input type="tel" id="editPhone" value="${p.phone}" required class="w-full px-3 py-2 rounded-xl border border-pastel-300">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">รพ.สต. / อนามัย</label>
                            <input type="text" id="editHealthCenter" value="${p.healthCenter}" required class="w-full px-3 py-2 rounded-xl border border-pastel-300">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">ที่อยู่</label>
                            <textarea id="editAddress" rows="2" required class="w-full px-3 py-2 rounded-xl border border-pastel-300">${p.address}</textarea>
                        </div>
                        <div class="flex justify-end space-x-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-xl font-semibold">ยกเลิก</button>
                            <button type="submit" class="px-4 py-2 bg-pastel-600 text-white rounded-xl font-bold">บันทึกการแก้ไข</button>
                        </div>
                    </form>
                </div>
            `;
            showModal(html);
        }

        function saveEditPatient(e, id) {
            e.preventDefault();
            const index = patients.findIndex(p => p.id === id);
            if (index !== -1) {
                patients[index].name = document.getElementById('editName').value;
                patients[index].phone = document.getElementById('editPhone').value;
                patients[index].healthCenter = document.getElementById('editHealthCenter').value;
                patients[index].address = document.getElementById('editAddress').value;
                setStorageData('patients', patients);
                closeModal();
                showAlert('สำเร็จ', 'แก้ไขข้อมูลผู้ป่วยเรียบร้อยแล้ว', 'success');
                renderTabContent();
            }
        }

        // Initialize on load
        window.onload = function() {
            render();
            if (currentUser) renderTabContent();
        }
    </script>
</body>
</html>
